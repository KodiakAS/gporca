name: Dev CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: dev-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.build_type }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: RelWithDebInfo
            build_dir: build-rel
            jobs: 2
          - build_type: Debug
            build_dir: build-debug
            jobs: 2
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (use system Xerces)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build cmake libxerces-c-dev

      - name: Build and test
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
          BUILD_TYPE: ${{ matrix.build_type }}
          JOBS: ${{ matrix.jobs }}
        run: |
          make test BUILD_DIR="${BUILD_DIR}" BUILD_TYPE="${BUILD_TYPE}" JOBS="${JOBS}" CMAKE_ARGS="-DGPORCA_BUNDLE_XERCES=OFF"
